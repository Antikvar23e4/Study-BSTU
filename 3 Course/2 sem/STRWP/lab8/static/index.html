<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static File Server</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Static File Server</h1>
    </header>

    <section>
      <h2>Resources:</h2>
      <ul>
        <li><a href="/document.docx" download>Download DOCX</a></li>
        <li><a href="/data.json" target="_blank">View JSON</a></li>
        <li><a href="/data.xml" target="_blank">View XML</a></li>
        <li><img src="/image.png" alt="Sample Image" /></li>
        <li>
          <video controls>
            <source src="/video.mp4" type="video/mp4" />
          </video>
        </li>
      </ul>
    </section>

    <section id="outputSection">
      <h3>Data Output:</h3>
      <div id="output"></div>
    </section>

    <script src="/script.js"></script>
  </body>
</html>
