<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Загрузка файла</title>
  </head>
  <body>
    <h1>Загрузка файла на сервер в директорию static</h1>
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <label for="fileInput"></label>
      <input type="file" id="fileInput" name="uploaded_file" /><br /><br />
      <input type="submit" value="Загрузить файл" />
    </form>
  </body>
</html>
