[pytest]
markers =
    smoke: быстрые дымовые тесты для проверки базовой работоспособности
    regression: полный набор регрессионных тестов
    login: тесты, связанные с функционалом входа/выхода
    checkout: тесты процесса оформления заказа
    e2e: сквозные пользовательские сценарии (end-to-end)
    negative: негативные тестовые сценарии
    cookies: тесты, связанные с работой кук (сохранение/загрузка/проверка)